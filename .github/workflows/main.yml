name: CI Pipeline

on: [push]

jobs:
  lint_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Linter
        run: |
          echo "Running linter check..."
          echo "Linter passed successfully."

  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Tests & Generate Report
        run: |
          echo "Running tests..."
          echo "Total coverage: 65%" > coverage_report.txt
          echo "Tests finished. Coverage report generated."

      - name: Check Code Coverage (Limit 50%)
        run: |
          COVERAGE_VALUE=$(awk '/Total coverage:/ {print $3}' coverage_report.txt | sed 's/%//')
          echo "Detected coverage: ${COVERAGE_VALUE}%"
          MIN_COVERAGE=50
          if [ "$COVERAGE_VALUE" -ge "$MIN_COVERAGE" ]; then
            echo "Code coverage meets requirements."
          else
            echo "Code coverage is too low!"
            exit 1
          fi

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report.txt
          retention-days: 5

  build_job:
    needs: test_job
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Project
        run: |
          echo "Building the project..."
          mkdir build_output
          echo "Binary file" > build_output/app.bin
          echo "Build artifact created."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build_output/
